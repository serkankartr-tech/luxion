# Luxion macOS DMG: GitHub'ın Mac sunucusunda derler ve Release'e ekler.
# Tetikleme: main'de uygulama dosyaları değişince, "v" ile başlayan bir etiket gönderilince ya da Actions sekmesinden elle.
name: macOS DMG

on:
  push:
    branches: [main]
    paths: ['macos/**', 'server/**', 'web/**', 'scripts/**', '.github/workflows/macos-dmg.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketle
        run: |
          SURUM="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || SURUM="1.0.0"
          LUXION_SURUM="$SURUM" bash macos/paketle.sh
          ls -la macos/cikti
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ETIKET="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || ETIKET="v1.0.0"
          gh release view "$ETIKET" >/dev/null 2>&1 || gh release create "$ETIKET" --title "Luxion ${ETIKET#v} (macOS)" --notes-file macos/KURULUM.txt
          gh release upload "$ETIKET" macos/cikti/*.dmg macos/cikti/*.zip --clobber
